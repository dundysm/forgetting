<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>forgetting</title>
<meta name="description" content="An AI agent's memory, replayed inside a real human brain. Every point of light is a token slot of vLLM's KV cache, replaying a real benchmark run.">
<meta property="og:title" content="forgetting">
<meta property="og:description" content="an AI agent's memory, replayed inside a real human brain">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
<style>
  :root { --ink: #dfe5ee; --mute: #8b95a3; --dim: #5d6672; --line: #ffffff1f; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink); font: 12px/1.4 var(--mono); }
  canvas { display: block; }
  .ui { position: fixed; z-index: 2; }
  #title { left: 22px; top: 18px; }
  #title h1 { margin: 0; font: 500 15px var(--mono); letter-spacing: .28em; text-transform: lowercase; }
  #title a { display: inline-block; margin-top: 6px; color: var(--mute); text-decoration: none; letter-spacing: .06em; }
  #title a:hover { color: var(--ink); }
  #ui { left: 22px; right: 22px; bottom: 18px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
  .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .lbl { color: var(--dim); letter-spacing: .12em; margin-right: 4px; }
  button { font: inherit; color: var(--mute); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  button:hover { color: var(--ink); border-color: #ffffff44; }
  button.on { color: #000; background: var(--ink); border-color: var(--ink); }
  #follow.on { background: #59f0ff; border-color: #59f0ff; }
  #scrub { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 220px; }
  #scrub input { flex: 1; accent-color: #c9d2de; }
  #hud { color: var(--mute); white-space: nowrap; }
  #hud b { color: var(--ink); font-weight: 500; }
  #hud .f { color: #9db4ff; }
  #tag { display: none; position: fixed; left: 0; right: 0; bottom: 9%; text-align: center; color: #c5cdd8; font: 34px var(--mono); letter-spacing: .15em; }
  #tag span { display: block; margin-top: 8px; font-size: 21px; color: #6c7684; letter-spacing: .12em; }
  @media (max-width: 640px) { #ui { bottom: 12px; left: 12px; right: 12px; } #title { left: 14px; top: 14px; } }
</style>
</head>
<body>
<div id="title" class="ui"><h1>forgetting</h1><a href="about.html">how this was made →</a></div>
<div id="ui" class="ui">
  <div class="group"><span class="lbl">memory</span><div id="budgets" class="group"></div></div>
  <div class="group"><button id="follow" class="on" title="highlight one agent's memory">follow agent 5</button></div>
  <div id="scrub"><button id="play">pause</button><input id="time" type="range" min="0" max="1000" value="0"><span id="hud"></span></div>
</div>
<div id="tag"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
